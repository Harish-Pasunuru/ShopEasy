<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ShopEasy - Cart</title>

<link rel="stylesheet" href="styles.css">

    </head>
    <body>
        <header>
            <h1>ShopEasy</h1>



<nav>

    <a href="index.html">Home</a>

    <a href="register.html">Register</a>

    <a href="login.html">Login</a>

    <a href="catalog.html">Catalog</a>

    <a href="cart.html">Cart (<span id="cart-count">2</span>)</a>

</nav>

        </header>
        <main class="cart-container">
            <h2>Your Shopping Cart</h2>



<!-- CART ITEMS LIST -->

<div class="cart-items">



    <!-- ITEM 1 -->

    <div class="cart-item">

        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQQTl5s5VbNHD0aQe5EjC9KDh_7TD_KKoRnWj5bQJnYZyOKLOpQMClkdrE&s=10" alt="Laptop Stand">



        <div class="item-details">

            <h3>Laptop Stand</h3>

            <p class="price">$49.99</p>

        </div>



        <div class="qty-controls">

            <button class="qty-btn">-</button>

            <span class="qty">1</span>

            <button class="qty-btn">+</button>

        </div>



        <button class="remove-btn">Remove</button>

    </div>



    <!-- ITEM 2 -->

    <div class="cart-item">

        <img src="https://images.unsplash.com/photo-1579586337278-3befd40fd17a?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8c21hcnQlMjB3YXRjaHxlbnwwfHwwfHx8MA%3D%3D" alt="Smart Watch">



        <div class="item-details">

            <h3>Smart Watch</h3>

            <p class="price">$199.99</p>

        </div>



        <div class="qty-controls">

            <button class="qty-btn">-</button>

            <span class="qty">1</span>

            <button class="qty-btn">+</button>

        </div>



        <button class="remove-btn">Remove</button>

    </div>



</div>



<!-- CART SUMMARY -->

<div class="cart-summary">

    <h3>Order Summary</h3>



    <p>Subtotal: $249.98</p>

    <p>Tax (10%): $25.00</p>

    <h3>Total: $274.98</h3>



    <a class="continue-btn" href="catalog.html">Continue Shopping</a>

    <button class="checkout-btn">Proceed to Checkout</button>

</div>

        </main>
        <footer>
            <p>© 2025 ShopEasy • Demo for Practical 1</p>
        </footer>
    </body>
</html>
