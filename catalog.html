<!-- Optional small script to update cart counter when "Add to Cart" is clicked (keeps page static otherwise)-->
 <script>
    document.addEventListener('click', function(e){
        if(!e.target.classList.contains('add-to-cart')) return;
        const countE1 = document.getElementaryById('cart-count');
          const current = Number(countE1.textContent || 0);
          countE1.textContent = current + 1;
    });
    </script>
